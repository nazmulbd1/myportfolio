    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var wantsLight = saved
            ? saved === 'light'
            : window.matchMedia('(prefers-color-scheme: light)').matches
          if (wantsLight) document.documentElement.classList.add('light')
        } catch (e) {}
      })()
    </script>

    <style>
      html, body { background-color: #14171F; color: #ECE9E2; }
      html.light, html.light body { background-color: #F6F4EF; color: #1B1D21; }
      html { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #root { opacity: 0; transition: opacity 0.12s ease; }
      #root.is-ready { opacity: 1; }
    </style>

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
